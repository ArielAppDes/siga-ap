<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Asistentes - SIGA</title>
<style>
    :root {
        --azul: #1F2A44;
        --verde: #18C48F;
        --gris-claro: #f8fafc;
        --borde-color: #cbd5e1;
        --texto-oscuro: #0f172a;
    }

    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #e2e8f0;
        padding: 15px;
        color: var(--texto-oscuro);
    }

    .no-print {
        max-width: 800px;
        margin: 0 auto 15px auto;
        display: flex;
        justify-content: flex-end;
    }

    .btn-imprimir {
        background-color: var(--verde);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    /* HOJA A4 EQUILIBRADA */
    .hoja-a4 {
        background: white;
        width: 800px;
        margin: 0 auto;
        padding: 30px 40px; /* Recuperamos espacio visual */
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        page-break-after: always;
        page-break-inside: avoid;
    }

    .header-container {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
    }

    .titulo-seccion h1 {
        font-size: 22px;
        font-weight: 800;
        color: var(--azul);
    }

    .titulo-seccion .subtitulo {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        margin-left: 6px;
    }

    .logo-box {
        background-color: var(--azul);
        padding: 8px 18px;
        border-radius: 8px;
        text-align: center;
        border-bottom: 3px solid var(--verde);
    }

    .logo-box h2 {
        font-size: 26px;
        font-weight: 900;
        color: var(--verde);
        line-height: 1;
    }

    .logo-box p {
        font-size: 9.5px;
        color: white;
        margin-top: 2px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 6px 25px;
        margin-bottom: 12px;
        font-size: 11.5px;
    }

    .info-item {
        display: flex;
        align-items: baseline;
    }

    .info-item label {
        font-weight: 700;
        color: var(--azul);
        width: 95px;
        flex-shrink: 0;
    }

    .info-item .valor {
        border-bottom: 1px dotted #94a3b8;
        flex: 1;
        min-height: 15px;
    }

    .hoja-num {
        text-align: right;
        font-size: 10.5px;
        font-weight: 700;
        color: #64748b;
        margin-bottom: 6px;
    }

    .seccion-titulo-tabla {
        font-size: 11.5px;
        font-weight: 800;
        color: var(--azul);
        margin-bottom: 6px;
    }

    /* TABLA CON ALTURA MEDIA (26px) */
    .tabla-contenedor {
        border: 1px solid var(--borde-color);
        border-top: 4px solid var(--verde);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 18px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
    }

    thead {
        background-color: var(--azul);
        color: white;
    }

    th {
        padding: 6px 4px;
        font-weight: 700;
        text-align: center;
        border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    td {
        padding: 4px 6px;
        border-bottom: 1px solid var(--borde-color);
        border-right: 1px solid var(--borde-color);
        height: 26px; /* Altura perfecta para escribir cómodo a mano */
    }

    tbody tr:nth-child(even) {
        background-color: var(--gris-claro);
    }

    .col-n { width: 30px; text-align: center; font-weight: bold; color: #64748b; }
    .col-leg { width: 60px; text-align: center; }
    .col-nombre { width: 270px; }
    .col-sector { width: 110px; }
    .col-linea { width: 85px; }
    .col-firma { width: 110px; }

    .footer-seccion {
        margin-top: 15px;
        font-size: 11.5px;
    }

    .linea-firma {
        display: flex;
        align-items: baseline;
        margin-bottom: 12px;
    }

    .linea-firma label {
        font-weight: 700;
        color: var(--azul);
        width: 140px;
    }

    .linea-firma .puntos {
        border-bottom: 1px dotted #64748b;
        flex: 1;
    }

    @page {
        size: A4 portrait;
        margin: 8mm;
    }

    @media print {
        body { background: none; padding: 0; margin: 0; }
        .no-print { display: none !important; }
        .hoja-a4 { width: 100%; box-shadow: none; padding: 0; margin: 0; }
        .tabla-contenedor, .logo-box, thead {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }
</style>
</head>

<body>

    <div class="no-print">
        <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    </div>

    <div class="hoja-a4">

        <!-- Encabezado con Logo SIGA -->
        <div class="header-container">
            <div class="titulo-seccion">
                <h1>Lista de Asistentes</h1>
                <span class="subtitulo">"CONSTANCIA DE CAPACITACIÓN"</span>
            </div>
            <div class="logo-box">
                <h2>SIGA</h2>
                <p>Empresa S.A</p>
            </div>
        </div>

        <!-- Información de la Capacitación -->
        <div class="info-grid">
            <div class="info-item"><label>FECHA:</label><span class="valor"></span></div>
            <div class="info-item"><label>HORARIO:</label><span class="valor"></span></div>
            <div class="info-item"><label>PROGRAMA:</label><span class="valor"></span></div>
            <div class="info-item"><label>MÓDULO:</label><span class="valor"></span></div>
            <div class="info-item" style="grid-column: span 2;"><label>TEMAS:</label><span class="valor"></span></div>
            <div class="info-item" style="grid-column: span 2;"><label>CAPACITADOR:</label><span class="valor"></span></div>
            <div class="info-item" style="grid-column: span 2;"><label>LUGAR:</label><span class="valor"></span></div>
        </div>

        <div class="hoja-num">HOJA 1 de 1</div>

        <div class="seccion-titulo-tabla">DATOS DE LOS PARTICIPANTES:</div>

        <!-- Tabla Estilizada con bordes redondeados y vivo verde superior -->
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th class="col-n">N°</th>
                        <th class="col-leg">Leg.</th>
                        <th class="col-nombre">Apellido y nombre</th>
                        <th class="col-sector">Sector</th>
                        <th class="col-linea">Línea</th>
                        <th class="col-firma">Firma</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Generación de 20 Filas -->
                    <script>
                        for (let i = 1; i <= 20; i++) {
                            document.write(`
                                <tr>
                                    <td class="col-n">${i}</td>
                                    <td class="col-leg"></td>
                                    <td class="col-nombre"></td>
                                    <td class="col-sector"></td>
                                    <td class="col-linea"></td>
                                    <td class="col-firma"></td>
                                </tr>
                            `);
                        }
                    </script>
                </tbody>
            </table>
        </div>

        <!-- Sección de Firmas u Observaciones -->
        <div class="footer-seccion">
            <div class="linea-firma">
                <label>Firma capacitadores:</label>
                <div class="puntos"></div>
            </div>
            <div class="linea-firma">
                <label>Observaciones:</label>
                <div class="puntos"></div>
            </div>
        </div>

    </div>

    <!-- SCRIPT QUE RECIBE LOS DATOS E IMPRIME -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Leer datos enviados desde el formulario
            const cabecera = JSON.parse(localStorage.getItem('siga_impresion_cabecera')) || {};
            const asistentes = JSON.parse(localStorage.getItem('siga_impresion_asistentes')) || [];

            // 2. Rellenar los campos de la cabecera
            const valores = document.querySelectorAll('.info-item .valor');
            if (valores.length >= 7) {
                valores[0].textContent = cabecera.fecha || '';
                valores[1].textContent = cabecera.horario || '';
                valores[2].textContent = cabecera.programa || '';
                valores[3].textContent = cabecera.modulo || '';
                valores[4].textContent = cabecera.temas || '';
                valores[5].textContent = cabecera.capacitador || '';
                valores[6].textContent = cabecera.lugar || '';
            }

            // 3. Rellenar los nombres y legajos en la tabla
            const filas = document.querySelectorAll('tbody tr');
            asistentes.forEach((emp, index) => {
                if (index < filas.length) {
                    const c = filas[index].children;
                    c[1].textContent = emp.legajo || '';
                    c[2].textContent = `${emp.apellido}, ${emp.nombre}`;
                    c[3].textContent = emp.sector !== '-' ? emp.sector : '';
                    c[4].textContent = emp.linea !== '-' ? emp.linea : '';
                }
            });

            // 4. Lanzar la ventana de impresión / PDF automáticamente
            setTimeout(() => {
                window.print();
            }, 500);
        });
    </script>
    
</body>
</html>
