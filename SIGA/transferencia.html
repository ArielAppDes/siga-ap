<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Transferencia de Conocimiento - SIGA</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 24px;
            border: 1px solid var(--border);
        }

        .header {
            border-bottom: 3px solid var(--accent);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0 0 6px 0;
            font-size: 1.3rem;
            color: var(--primary);
        }

        .meta-box {
            background-color: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        select, input[type="text"], textarea, input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Bloques dinámicos ocultos por defecto */
        .conditional-block {
            display: none;
            background-color: #fff8f1;
            border-left: 4px solid #f97316;
            padding: 14px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
        }

        .btn-submit {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .success-msg h3 {
            color: #16a34a;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="formContainer">
        <div class="header">
            <h2>Evaluación de Transferencia de Conocimiento al Puesto</h2>
            <small style="color: #64748b;">A completar por el jefe o superior directo</small>
        </div>

        <!-- Datos de la Actividad (Autocompletados o Lectura) -->
        <div class="meta-box">
            <div><strong>Curso:</strong> <span id="lblCurso">Cargando...</span></div>
            <div><strong>Fecha Curso:</strong> <span id="lblFecha">--/--/----</span></div>
            <div><strong>Participante:</strong> <span id="lblParticipante">Cargando...</span></div>
            <div><strong>Legajo:</strong> <span id="lblLegajo">----</span></div>
        </div>

        <form id="frmEncuesta">
            <!-- Pregunta 1 -->
            <div class="form-group">
                <label>1. ¿El participante aplica a su tarea los contenidos impartidos en el curso?</label>
                <select id="aplicaContenidos" required onchange="evaluarRespuesta()">
                    <option value="">-- Seleccione una opción --</option>
                    <option value="SI">SI</option>
                    <option value="PARCIALMENTE">PARCIALMENTE (*)</option>
                    <option value="NO">NO (*)</option>
                </select>
            </div>

            <!-- Preguntas Condicionales (2 y 3) -->
            <div id="bloqueDetalle" class="conditional-block">
                <div class="form-group">
                    <label>2. ¿Por qué crees que no se aplican los contenidos? (Especifica/Ejemplifica las dificultades)</label>
                    <textarea id="motivoDificultad" placeholder="Describa brevemente las dificultades detectadas..."></textarea>
                </div>

                <div class="form-group">
                    <label>3. Plan de Acción (Acciones necesarias para lograr el desempeño requerido)</label>
                    <textarea id="planAccion" placeholder="Ennumere las acciones acordadas..."></textarea>
                </div>
            </div>

            <!-- Firma / Responsable -->
            <div class="form-group">
                <label>Nombre y Apellido del Responsable (Evaluador):</label>
                <input type="text" id="firmaResponsable" placeholder="Ej: Juan Pérez (Jefe Directo)" required>
            </div>

            <button type="submit" class="btn-submit">Enviar Evaluación</button>
        </form>
    </div>

    <!-- Mensaje de Confirmación -->
    <div id="successMsg" class="success-msg">
        <h3>¡Evaluación Registrada con Éxito!</h3>
        <p>Los datos han sido guardados correctamente en el sistema SIGA.</p>
    </div>
</div>

<!-- Scripts de Conexión -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="jss/supaBaseClient.js"></script>
<script>
    // Obtener parámetros desde la URL
    const urlParams = new URLSearchParams(window.location.search);
    const cursoParam = urlParams.get('curso') || "Capacitación Operativa Demo";
    const fechaParam = urlParams.get('fecha') || new Date().toISOString().split('T')[0];
    const legajoParam = urlParams.get('legajo') || "9999";
    const nombreParam = urlParams.get('nombre') || "Empleado Ejemplo";

    // Cargar datos en pantalla
    document.getElementById('lblCurso').textContent = cursoParam;
    document.getElementById('lblFecha').textContent = fechaParam;
    document.getElementById('lblParticipante').textContent = nombreParam;
    document.getElementById('lblLegajo').textContent = legajoParam;

    // Desplegar preguntas 2 y 3 solo si responde PARCIALMENTE o NO
    function evaluarRespuesta() {
        const val = document.getElementById('aplicaContenidos').value;
        const bloque = document.getElementById('bloqueDetalle');
        if (val === 'PARCIALMENTE' || val === 'NO') {
            bloque.style.display = 'block';
            document.getElementById('motivoDificultad').required = true;
            document.getElementById('planAccion').required = true;
        } else {
            bloque.style.display = 'none';
            document.getElementById('motivoDificultad').required = false;
            document.getElementById('planAccion').required = false;
        }
    }

    // Guardar en Supabase al enviar el formulario
    document.getElementById('frmEncuesta').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const db = window.supabaseClient || window.supabase;
        
        const payload = {
            nombre_curso: cursoParam,
            fecha_curso: fechaParam,
            legajo: legajoParam,
            nombre: nombreParam,
            aplica_contenidos: document.getElementById('aplicaContenidos').value,
            motivo_dificultad: document.getElementById('motivoDificultad').value || null,
            plan_accion: document.getElementById('planAccion').value || null,
            firma_responsable: document.getElementById('firmaResponsable').value
        };

        const { data, error } = await db.from('encuestas_transferencia').insert([payload]);

        if (error) {
            alert("Error al guardar la encuesta: " + error.message);
        } else {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        }
    });
</script>
</body>
</html>
